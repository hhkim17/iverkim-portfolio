<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TouchDesigner Beginner Course</title><meta name="robots" content="noindex, nofollow"><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"><style id="td-style">
/* Layout: a network-editor shell — fixed rail of weeks on the left, one week open at a time on a faint node grid. */
:root{
  --bg:#f2f3f5; --surface:#ffffff; --sunk:#e8eaee; --ink:#15181d; --muted:#596170; --line:#d9dce2;
  --accent:#0d7480; --accent-ink:#ffffff; --grid:rgba(21,24,29,.055);
  --top:#7b45c4; --chop:#24884a; --sop:#127f9e; --pop:#2b66c9; --mat:#9a6b00; --dat:#b5356f; --comp:#5f6673;
  --k-orange:#c2560e; --k-blue:#2b66c9; --k-green:#24884a;
  --f-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --rail:260px; --measure:56rem; --wide:74rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161a; --surface:#1b1e23; --sunk:#22262c; --ink:#e6e8eb; --muted:#9aa2ae; --line:#2d3239;
  --accent:#4cc0ca; --accent-ink:#0b1416; --grid:rgba(230,232,235,.05);
  --top:#b48cf0; --chop:#6fcf8a; --sop:#5cc6e2; --pop:#7ea9f4; --mat:#e3bf4f; --dat:#f08ab5; --comp:#a7adb8;
  --k-orange:#f29b5c; --k-blue:#7ea9f4; --k-green:#6fcf8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161a; --surface:#1b1e23; --sunk:#22262c; --ink:#e6e8eb; --muted:#9aa2ae; --line:#2d3239;
  --accent:#4cc0ca; --accent-ink:#0b1416; --grid:rgba(230,232,235,.05);
  --top:#b48cf0; --chop:#6fcf8a; --sop:#5cc6e2; --pop:#7ea9f4; --mat:#e3bf4f; --dat:#f08ab5; --comp:#a7adb8;
  --k-orange:#f29b5c; --k-blue:#7ea9f4; --k-green:#6fcf8a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.75;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);letter-spacing:.02em}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);
  padding:28px 0 40px;padding-left:max(0px,env(safe-area-inset-left,0px))}
.brand{display:block;padding:0 24px 22px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .mono{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.brand b{display:block;font-size:17px;line-height:1.3;margin-top:6px;font-weight:700;letter-spacing:-.01em}
.rail ol{list-style:none;margin:0;padding:0}
.rail .wk-link,.rail .plain{display:flex;gap:12px;align-items:baseline;padding:9px 24px;text-decoration:none;color:var(--muted);
  font-size:14px;line-height:1.4;border-left:3px solid transparent}
.rail .wk-link:hover,.rail .plain:hover{color:var(--ink);background:var(--sunk)}
.rail .wk-no{font-family:var(--f-mono);font-size:11px;flex:none;white-space:nowrap;text-transform:uppercase;letter-spacing:.1em}
.rail .wk-link,.rail .plain{flex-direction:column;align-items:flex-start;gap:1px}
.rail a[aria-current="page"]{color:var(--ink);border-left-color:var(--accent);background:var(--sunk);font-weight:600}
.rail a[aria-current="page"] .wk-no{color:var(--accent)}
.toc{display:none;padding:4px 0 10px!important}
.toc.open{display:block}
.toc a{display:block;padding:5px 20px 5px 40px;font-size:13px;line-height:1.45;color:var(--muted);text-decoration:none}
.toc .l3 a{padding-left:54px;font-size:12.5px}
.toc a:hover{color:var(--ink)}
.toc a.active{color:var(--accent);font-weight:600}
.rail-legend{margin:22px 24px 0;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.rail-sep{height:1px;background:var(--line);margin:10px 24px}

.main{min-width:0;background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{max-width:var(--wide);margin:0;padding-block:56px 96px;padding-inline:clamp(0px,3.5vw,64px)}

/* ---------- mobile top bar ---------- */
.topbar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .topbar{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar-in{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
  .topbar-in::-webkit-scrollbar{display:none}
  .topbar a{flex:none;font-family:var(--f-mono);font-size:12.5px;text-decoration:none;color:var(--muted);padding:6px 11px;border:1px solid var(--line);border-radius:999px}
  .topbar a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .view{padding-block:32px 72px}
}
.mtoc{display:none}
@media (max-width:900px){
  .mtoc{display:block;margin-top:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
  .mtoc summary{cursor:pointer;padding:10px 14px;font-size:14px;font-weight:600}
  .mtoc ol{list-style:none;margin:0;padding:0 14px 12px}
  .mtoc a{display:block;padding:4px 0;font-size:14px;color:var(--muted);text-decoration:none}
  .mtoc .l3 a{padding-left:14px;font-size:13px}
}

/* ---------- type ---------- */
.eyebrow{margin:0 0 10px;font-size:13px;color:var(--muted)}
.eyebrow .mono{color:var(--accent);font-weight:600;font-size:12px;letter-spacing:.1em}
h1,h2,h3,h4{text-wrap:balance;letter-spacing:-.015em}
.hero h1{font-size:clamp(2.4rem,6vw,3.6rem);line-height:1.06;margin:0 0 20px;font-weight:700}
.week-head h1{font-size:clamp(2rem,5vw,2.8rem);line-height:1.12;margin:0 0 16px;font-weight:700}
.lede{font-size:18px;color:var(--muted);max-width:36rem;margin:0}
.sec-label{font-family:var(--f-mono);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:56px 0 16px}

/* ---------- overview ---------- */
.fam-chain{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.fam-node{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px 12px 18px;display:grid;gap:2px}
.fam-node::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:6px 0 0 6px;background:var(--c)}
.fn-name{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--c)}
.fn-full{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.fn-desc{font-size:13.5px;margin-top:4px}
.top{--c:var(--top)} .chop{--c:var(--chop)} .sop{--c:var(--sop)} .pop{--c:var(--pop)} .mat{--c:var(--mat)} .dat{--c:var(--dat)} .comp{--c:var(--comp)}

.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.wcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.wcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.wcard-img{aspect-ratio:16/10;background:var(--sunk);overflow:hidden;max-width:100%}
.wcard-img img{width:100%;height:100%;object-fit:cover;display:block}
.wcard-body{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.wcard h3{margin:0 0 8px;font-size:19px;line-height:1.3}
.wcard ul{margin:0 0 14px;padding-left:18px;font-size:13.5px;color:var(--muted);line-height:1.65}
.wcard-foot{margin:auto 0 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.dots{display:flex;gap:5px}
.dot{width:9px;height:9px;border-radius:2px;background:var(--c);display:block}
.extra{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-top:16px;padding:16px 18px;border:1px dashed var(--line);border-radius:8px;text-decoration:none;color:var(--ink);background:var(--surface)}
.extra .mono{font-size:12px;color:var(--accent);font-weight:600}
.extra span:last-child{color:var(--muted);font-size:14px}
.extra:hover{border-color:var(--accent)}

/* ---------- week header ---------- */
.week-head{padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:8px}
.topics{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:14.5px}
.topics li::before{content:"→ ";color:var(--accent);font-family:var(--f-mono)}
.res-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.res{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);
  text-decoration:none;color:var(--ink);font-size:13.5px}
.res:hover{border-color:var(--accent)}
.res-k{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.ops-index{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 16px 12px}
.ops-index summary{cursor:pointer;padding:10px 0;font-size:14px;font-weight:600}
.ops-index summary .mono{color:var(--muted);font-weight:500;margin-left:4px}
.idx-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.idx-fam{font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--c);padding-top:4px}
.idx-chips{display:flex;flex-wrap:wrap;gap:5px}

.plan{margin:0 0 20px;max-width:var(--measure)}
.plan-h{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.plan-h .mono{color:var(--accent);font-size:12px;letter-spacing:.1em;margin-right:4px}
.plan ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.plan li{display:flex;align-items:baseline;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13.5px;line-height:1.4}
.plan li.is-break{background:transparent;border-style:dashed;color:var(--muted)}
.plan-t{font-size:11.5px;font-weight:600;color:var(--accent);white-space:nowrap}
.plan li.is-break .plan-t{color:var(--muted)}
/* ---------- operator chips ---------- */
.op{font-family:var(--f-mono);font-weight:500;font-size:.88em;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 30%,transparent);border-radius:4px;padding:.05em .4em .1em;white-space:nowrap;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.op::before{content:"";display:inline-block;width:.45em;height:.45em;border-radius:1.5px;background:var(--c);margin-right:.35em;vertical-align:.12em}
.idx-chips .op{font-size:12.5px}
.fam-text{color:var(--c)}
.k{font-weight:700}
.k.orange{color:var(--k-orange)} .k.blue{color:var(--k-blue)} .k.green{color:var(--k-green)}

/* ---------- prose ---------- */
.prose{max-width:100%}
.prose>*{max-width:100%}
.prose>p,.prose>ul,.prose>ol,.prose>h2,.prose>h3,.prose>h4,.prose>blockquote,.prose>.callout,.prose>.bookmark{max-width:var(--measure)}
.prose h2{font-size:1.7rem;line-height:1.25;margin:72px 0 18px;padding-top:24px;border-top:2px solid var(--ink);scroll-margin-top:24px}
.prose h3{font-size:1.3rem;line-height:1.35;margin:48px 0 12px;scroll-margin-top:24px}
.prose h4{font-size:1.08rem;margin:36px 0 8px;scroll-margin-top:24px}
@media (max-width:900px){.prose h2,.prose h3,.prose h4{scroll-margin-top:72px}}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{padding-left:1.3em;margin:0 0 16px}
.prose li{margin:3px 0}
.prose hr{border:0;border-top:1px dashed var(--line);margin:32px 0}
.prose code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);padding:.1em .35em;border-radius:4px}
.prose blockquote{margin:24px 0;padding:4px 0 4px 18px;border-left:3px solid var(--line);color:var(--muted)}
.definition{background:var(--surface);border:1px solid var(--line)!important;border-left:0!important;border-radius:8px;padding:20px 22px!important;color:var(--ink)!important}
.definition p{margin:0 0 8px;font-size:17px;line-height:1.6}
.definition p+p{color:var(--muted);font-size:15px;margin:0}
.term{padding-left:14px;border-left:2px solid var(--line)}
.term .k{margin-right:.4em}
.prose sup{font-size:.7em}

.shot{margin:22px 0;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.shot .zoom{all:unset;cursor:zoom-in;display:block;max-width:100%;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--surface);line-height:0}
.shot .zoom:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shot img{display:block;max-width:100%;width:auto;height:auto;max-height:760px}
.shot figcaption{font-size:13.5px;line-height:1.6;color:var(--muted);max-width:var(--measure)}
.shot video{display:block;max-width:100%;border-radius:6px;border:1px solid var(--line);background:#000}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin:22px 0}
.gallery .shot{margin:0}
.gallery .shot img{max-height:520px}
.gallery.cards{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.gallery.cards .shot{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 8px 12px;align-items:stretch}
.gallery.cards .zoom{border:0;border-radius:4px;background:var(--sunk);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;width:100%}
.gallery.cards .zoom img{max-height:100%;max-width:100%;object-fit:contain}
.gallery.cards figcaption{padding:0 4px;font-size:13px}
@media (max-width:520px){.gallery{grid-template-columns:minmax(0,1fr)}}
.prose>.callout .shot img{max-width:min(100%,44rem)}

.callout{background:color-mix(in srgb,var(--accent) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));border-radius:8px;padding:18px 20px 6px;margin:28px 0}

.bookmark{display:flex;flex-direction:column;gap:2px;padding:12px 16px;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-decoration:none;color:var(--ink);max-width:var(--measure)}
.bookmark:hover{border-color:var(--accent)}
.bm-title{font-weight:600;font-size:15px}
.bm-host{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.file{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;margin:6px 0;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-decoration:none;color:var(--ink);font-size:14px}
.file:hover{border-color:var(--accent)}
.file-ext{font-family:var(--f-mono);font-size:11px;font-weight:600;background:var(--ink);color:var(--bg);padding:3px 6px;border-radius:4px}
.file-note{font-size:12px;color:var(--muted)}
button.file{font:inherit;font-size:14px;cursor:pointer;text-align:left}
button.file:disabled{cursor:progress;opacity:.7}

.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:24px 0 8px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 18px 8px;min-width:0;display:flex;flex-direction:column}
.tool.is-ours{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.tool header{margin-bottom:8px}
.prose .tool-name{margin:0;font-size:1.25rem;line-height:1.3}
.tool-maker{margin:2px 0 0!important;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tool.is-ours .tool-maker{color:var(--accent)}
.tool-line{font-size:15px;line-height:1.6;margin:0 0 12px!important}
.tool dl{margin:0;display:grid;gap:0}
.tool dt{font-family:var(--f-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:10px;border-top:1px solid var(--line)}
.tool dd{margin:2px 0 10px;font-size:14px;line-height:1.6}
.tool dd ul{margin:0;padding-left:1.1em}
.tool dd li{margin:2px 0}

.xmap-fig{margin:28px 0;max-width:100%}
.xmap-wrap{overflow-x:auto;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--ink)}
.xmap{display:block;width:100%;min-width:760px;height:auto}
.xmap-fig figcaption{font-size:14px;line-height:1.65;color:var(--muted);margin-top:10px;max-width:var(--measure)}
.xmap-fig figcaption b{color:var(--ink);font-weight:600}

.bits{display:grid;gap:10px;margin:18px 0 24px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;max-width:var(--measure)}
.bits-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center}
.bits-k{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted)}
.bits-set{display:flex;flex-wrap:wrap;gap:6px 10px;min-width:0}
.bits-set .grp{display:inline-flex;gap:2px}
.bits-set .more{font-family:var(--f-mono);font-size:12px;color:var(--muted);align-items:center}
.bits .b{display:inline-grid;place-items:center;width:20px;height:22px;border-radius:4px;font:600 12px var(--f-mono);font-style:normal;color:var(--muted);background:var(--sunk);border:1px solid var(--line)}
.bits .b.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.bits-v{font-size:13.5px;white-space:nowrap}
.bits-v b{font-weight:700}
.bits-row.is-byte{padding-top:10px;border-top:1px dashed var(--line)}
@media (max-width:520px){.bits-row{grid-template-columns:44px minmax(0,1fr)}.bits-v{grid-column:2}}
.units td:first-child{white-space:nowrap}
.prose .table-note{margin-top:-8px;font-size:13.5px;color:var(--muted)}

.table-wrap{overflow-x:auto;margin:20px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-size:12px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk)}
.io tbody th{font-weight:600;background:var(--sunk);width:9.5em;border-right:1px solid var(--line)}
.io tr:not(.grp) td{border-top:0}
.io tbody tr td{border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}

.code{position:relative;margin:20px 0;background:#15181d;color:#e6e8eb;border-radius:8px;padding:18px 18px 18px;overflow-x:auto;font-size:13.5px;line-height:1.6}
.code code{font-family:var(--f-mono);background:none;padding:0;color:inherit;font-size:inherit}
.copy{position:sticky;float:right;left:100%;top:0;margin:-6px -6px 0 12px;font:500 12px var(--f-sans);color:#e6e8eb;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:4px 10px;cursor:pointer}
.copy:hover{background:rgba(255,255,255,.16)}
.code .kw{color:#c7a4ff} .code .st{color:#9fdc9f} .code .nu{color:#f5b971} .code .fn{color:#7fc6f0}

.pagers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:72px;max-width:var(--measure)}
.week-head .topics,.week-head .lede{max-width:var(--measure)}
.pager{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
.pager span{font-size:12px;color:var(--muted);font-weight:400}
.pager.next{text-align:right}
.pager:hover{border-color:var(--accent)}
@media (max-width:520px){.pagers{grid-template-columns:1fr}.pager.next{text-align:left}}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,12,15,.92);display:flex;align-items:center;justify-content:center;
  padding:max(48px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(48px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;background:#fff}
.lb-cap{position:absolute;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom,0px));text-align:center;color:#d6d9de;font-size:13px;padding:0 60px}
.lb button{position:absolute;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;width:42px;height:42px;font-size:18px;cursor:pointer}
.lb .lb-x{top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px))}
.lb .lb-p{left:max(10px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
.lb .lb-n{right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ---------- password gate ---------- */
.gate{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px 16px;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:22px 22px}
.gate.checking form{visibility:hidden}
.gate form{width:min(100%,380px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px 22px;box-shadow:0 12px 32px rgba(0,0,0,.08)}
.gate h1{font-size:26px;line-height:1.15;margin:0 0 22px;font-weight:700;letter-spacing:-.015em}
.gate label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.gate input{width:100%;font:16px var(--f-sans);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.gate input:focus{outline:2px solid var(--accent);outline-offset:1px}
.gate button{margin-top:12px;width:100%;font:600 15px var(--f-sans);padding:11px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.gate button:disabled{opacity:.6;cursor:progress}
.gate-err{min-height:1.4em;margin:10px 0 0;font-size:13px;color:var(--dat)}
/* ---------- language switch ---------- */
.lang-switch{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.rail .lang-switch{margin:0 24px 14px}
.lang-switch button{font:600 12px var(--f-sans);color:var(--muted);background:none;border:0;border-radius:999px;padding:5px 12px;cursor:pointer;line-height:1.3}
.lang-switch button:hover{color:var(--ink)}
.lang-switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
body.editing .lang-switch{opacity:.4;pointer-events:none}
@media (max-width:900px){
  .topbar{display:flex!important;align-items:center;gap:8px}
  .topbar-in{flex:1;min-width:0}
  .topbar .lang-switch{flex:none}
  .topbar .lang-switch button{padding:5px 9px;font-family:var(--f-mono)}
}
/* ---------- edit mode ---------- */
.ed-fab{position:fixed;z-index:40;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  font:600 13px var(--f-sans);color:var(--accent-ink);background:var(--accent);border:0;border-radius:999px;padding:10px 16px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.ed-bar{position:fixed;z-index:40;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;
  background:var(--surface);border-top:2px solid var(--accent);box-shadow:0 -6px 20px rgba(0,0,0,.12);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ed-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ed-bar button,.ed-figtools button{font:500 13px var(--f-sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.ed-bar button:hover,.ed-figtools button:hover{border-color:var(--accent)}
.ed-bar .ed-chips{display:flex;flex-wrap:wrap;gap:4px;padding:0 6px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.ed-bar .ed-chips .op{font-size:12px;padding:5px 7px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border-color:color-mix(in srgb,var(--c) 30%,transparent)}
.ed-bar .ed-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.ed-status{margin:0;flex:1 1 220px;font-size:13px;color:var(--muted);min-width:0}
.ed-figtools{position:absolute;z-index:41;display:flex;flex-wrap:wrap;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.ed-figtools .ed-danger{color:var(--dat)}
body.editing .main{padding-bottom:120px}
body.editing [contenteditable="true"]{outline:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:6px;border-radius:2px}
body.editing [contenteditable="true"]:focus{outline:2px solid var(--accent)}
body.editing .prose .zoom{cursor:pointer}
body.editing figure.is-selected .zoom,body.editing figure.is-selected video{outline:3px solid var(--accent);outline-offset:2px}

  const form=GATE.querySelector('form'),inp=GATE.querySelector('input'),err=GATE.querySelector('.gate-err'),btn=GATE.querySelector('button');
  async function derive(pw){
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);

  }
  function install(data,key){
    TD.key=key;
    ['ko','en'].forEach(l=>{const t=document.createElement('template');t.id='tpl-'+l;t.innerHTML=data[l]||'';document.body.appendChild(t)});
    GATE.hidden=true;resolve();
  }
  TD.seal=async function(obj){
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},TD.key,new TextEncoder().encode(JSON.stringify(obj)));
    return {v:1,iter:TD.vault.iter,salt:TD.vault.salt,iv:b64e(iv),ct:b64e(ct)};
  };

  if(!window.crypto||!crypto.subtle){err.textContent='이 브라우저에서는 열 수 없어요 · This browser is not supported';ready();return}

  })();

    e.preventDefault();if(!inp.value)return;

      try{localStorage.setItem('td-k',b64e(await crypto.subtle.exportKey('raw',key)))}catch(_){}
      install(data,key);
    }catch(x){err.textContent='비밀번호가 맞지 않아요 · Incorrect password';inp.select()}

})();

/* ---------- language + router ---------- */
(function(){
  const TD=window.TD=window.TD||{};
  const root=document.getElementById('app-root');
  const S={
    ko:{copy:'복사',copied:'복사됨',selected:'선택됨 · ⌘C',lb:'이미지 크게 보기',lbClose:'닫기',lbPrev:'이전 이미지',lbNext:'다음 이미지'},
    en:{copy:'Copy',copied:'Copied',selected:'Selected · ⌘C',lb:'View larger image',lbClose:'Close',lbPrev:'Previous image',lbNext:'Next image'}
  };
  let views=[],ids=new Set();
  function pickLang(){
    let l=null;try{l=localStorage.getItem('td-lang')}catch(e){}
    if(l!=='ko'&&l!=='en')l=(navigator.language||'').toLowerCase().indexOf('ko')===0?'ko':'en';
    return l;
  }
  function sectionView(secId){const el=document.getElementById(secId);return el&&root.contains(el)?el.closest('.view'):null}
  function show(id,opts){
    opts=opts||{};
    if(!ids.has(id)){const v=sectionView(id);if(v){show(v.id,{sec:id});return}id='course'}
    views.forEach(v=>v.hidden=v.id!==id);
    root.querySelectorAll('[data-view]').forEach(a=>{if(a.tagName==='A'){if(a.dataset.view===id&&!a.classList.contains('pager')&&!a.classList.contains('wcard')&&!a.classList.contains('extra'))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')}});
    root.querySelectorAll('.toc').forEach(o=>o.classList.toggle('open',o.dataset.for===id));
    const cur=root.querySelector('.topbar a[aria-current]');if(cur)cur.scrollIntoView({block:'nearest',inline:'center'});
    if(opts.sec){const s=document.getElementById(opts.sec);if(s)requestAnimationFrame(()=>s.scrollIntoView())}
    else if(!opts.keepScroll)window.scrollTo(0,0);
    try{history.replaceState(null,'','#'+id)}catch(e){}
    observe(id);
  }
  let io;
  function observe(id){
    if(io)io.disconnect();
    const v=document.getElementById(id);if(!v||!('IntersectionObserver' in window))return;
    const heads=[...v.querySelectorAll('.prose h2[id],.prose h3[id]')];
    const links=[...root.querySelectorAll('.toc a[data-sec]')];
    io=new IntersectionObserver(ents=>{ents.forEach(en=>{if(en.isIntersecting){links.forEach(l=>l.classList.toggle('active',l.dataset.sec===en.target.id))}})},{rootMargin:'0px 0px -75% 0px'});
    heads.forEach(h=>io.observe(h));
  }
  function bindCopy(){
    root.querySelectorAll('.code').forEach(pre=>{
      const code=pre.querySelector('code'),b=pre.querySelector('.copy');if(!code||!b)return;
      b.addEventListener('click',()=>{const raw=code.textContent,t=S[TD.lang];
        const done=()=>{b.textContent=t.copied;setTimeout(()=>b.textContent=t.copy,1600)};
        const fallback=()=>{const r=document.createRange();r.selectNodeContents(code);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent=t.selected;setTimeout(()=>b.textContent=t.copy,2200)};
        try{navigator.clipboard.writeText(raw).then(done,fallback)}catch(e){fallback()}
      });
    });
  }
  const lb=document.getElementById('lb'),lbImg=document.getElementById('lb-img'),lbCap=document.getElementById('lb-cap');
  function setLbLabels(){const t=S[TD.lang];lb.setAttribute('aria-label',t.lb);lb.querySelector('.lb-x').setAttribute('aria-label',t.lbClose);lb.querySelector('.lb-p').setAttribute('aria-label',t.lbPrev);lb.querySelector('.lb-n').setAttribute('aria-label',t.lbNext)}
  function mount(l,target){
    const tpl=document.getElementById('tpl-'+l);if(!tpl)return;
    TD.lang=l;document.documentElement.lang=l;
    root.replaceChildren(tpl.content.cloneNode(true));
    views=[...root.querySelectorAll('.view')];ids=new Set(views.map(v=>v.id));
    root.querySelectorAll('button[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===l)));
    bindCopy();setLbLabels();
    show(target||(location.hash||'').slice(1)||'course',{keepScroll:false});
    document.dispatchEvent(new CustomEvent('td:mount',{detail:{lang:l}}));
  }
  TD.switchLang=function(l){
    if(l===TD.lang||document.body.classList.contains('editing'))return;
    try{localStorage.setItem('td-lang',l)}catch(e){}
    const cur=views.find(v=>!v.hidden);
    mount(l,cur?cur.id:'course');
  };
  document.addEventListener('click',e=>{
    const lbtn=e.target.closest('button[data-lang]');
    if(lbtn){e.preventDefault();TD.switchLang(lbtn.dataset.lang);return}
    const a=e.target.closest('a[data-view]');
    if(a){e.preventDefault();show(a.dataset.view);return}
    const s=e.target.closest('a[data-sec]');
    if(s){e.preventDefault();const el=document.getElementById(s.dataset.sec);if(el){el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});const d=s.closest('details.mtoc');if(d)d.open=false}}
  });

  // lightbox
  let list=[],idx=0;
  function open(i){idx=(i+list.length)%list.length;const im=list[idx];lbImg.src=im.currentSrc||im.src;
    const fc=im.closest('figure').querySelector('figcaption');lbCap.textContent=fc?fc.textContent:'';lb.hidden=false;document.body.style.overflow='hidden'}
  function close(){lb.hidden=true;lbImg.removeAttribute('src');document.body.style.overflow=''}
  document.addEventListener('click',e=>{
    const z=e.target.closest('.zoom');
    if(z&&!document.body.classList.contains('editing')){const v=z.closest('.view');if(!v)return;list=[...v.querySelectorAll('.zoom img')];open(list.indexOf(z.querySelector('img')));}
  });
  lb.querySelector('.lb-x').onclick=close;
  lb.querySelector('.lb-p').onclick=e=>{e.stopPropagation();open(idx-1)};
  lb.querySelector('.lb-n').onclick=e=>{e.stopPropagation();open(idx+1)};
  lb.addEventListener('click',e=>{if(e.target===lb)close()});
  document.addEventListener('keydown',e=>{if(lb.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')open(idx-1);if(e.key==='ArrowRight')open(idx+1)});

  TD.ready.then(()=>mount(pickLang()));
})();

/* ---------- file downloads ---------- */
(function(){
  const S={
    ko:{na:'이 화면에서는 파일을 받을 수 없어요',prep:'준비 중…',saved:'저장했어요',declined:'저장을 취소했어요',rate:'잠시 후 다시 눌러 주세요',fail:'파일을 받지 못했어요'},
    en:{na:"Downloads aren't available in this view",prep:'Preparing…',saved:'Saved',declined:'Download canceled',rate:'Please try again in a moment',fail:"Couldn't download the file"}
  };
  const dlP=(window.claude&&typeof claude.use==='function')?claude.use('downloads').catch(()=>null):Promise.resolve(null);
  document.addEventListener('click',async e=>{
    const b=e.target.closest('button.file[data-dl]');
    if(!b||document.body.classList.contains('editing'))return;
    const t=S[window.TD.lang]||S.ko;
    const note=b.querySelector('.file-note'),orig=b.dataset.label||(b.dataset.label=note.textContent);
    const say=(x,ms)=>{note.textContent=x;if(ms)setTimeout(()=>{note.textContent=orig},ms)};
    const dl=await dlP;
    b.disabled=true;say(t.prep);
    try{
      const j=await (await fetch(b.dataset.dl)).json();
      const bin=atob(j.b64),bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      const blob=new Blob([bytes]);
      if(dl)await dl.save({filename:j.name,data:blob});
      else{ // a regular website (iverkim.com): ordinary browser download
        const u=URL.createObjectURL(blob),a=document.createElement('a');
        a.href=u;a.download=j.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
      }
      say(t.saved,2500);
    }catch(err){
      const c=err&&err.code;
      say(c==='declined'?t.declined:c==='rate_limited'?t.rate:t.fail,3000);
    }finally{b.disabled=false}
  });
})();

    return el&&el.closest('[contenteditable="true"]');
  }
  function blockAtCaret(){
    const sel=getSelection();if(!sel.rangeCount)return null;
    let n=sel.getRangeAt(0).startContainer;n=n.nodeType===1?n:n.parentElement;
    const prose=n&&n.closest('.prose');if(!prose)return null;
    while(n&&n.parentElement!==prose)n=n.parentElement;
    return n;
  }
  function chip(fam){
    const sel=getSelection();
    if(!sel.rangeCount||!inEditable()){status(t('selFirst'));return}
    const r=sel.getRangeAt(0);
    const start=r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement;
    const existing=start&&start.closest('strong.op');
    if(fam==='none'){
      if(existing){existing.replaceWith(document.createTextNode(existing.textContent));markDirty()}
      else status(t('cursorChip'));
      return;
    }
    if(existing&&sel.isCollapsed){existing.className='op '+fam;markDirty();return}
    if(sel.isCollapsed){status(t('selFirst'));return}
    const s=document.createElement('strong');s.className='op '+fam;s.textContent=r.toString();
    r.deleteContents();r.insertNode(s);
    sel.removeAllRanges();const nr=document.createRange();nr.setStartAfter(s);nr.collapse(true);sel.addRange(nr);
    markDirty();
  }
  function toggleHeading(){
    const b=blockAtCaret();
    if(!b||!/^(P|H3)$/.test(b.tagName)){status(t('cursorHead'));return}
    const n=document.createElement(b.tagName==='P'?'h3':'p');
    n.innerHTML=b.innerHTML;b.replaceWith(n);markDirty();
  }

  // ---- figures ----
  document.addEventListener('click',e=>{
    if(!editing)return;
    if(e.target.closest('.ed-figtools,.ed-bar'))return;
    const z=e.target.closest('.prose .zoom, .prose video');
    if(z){e.preventDefault();e.stopPropagation();selectFig(z.closest('figure'));return}
    if(!e.target.closest('figure.is-selected'))selectFig(null);
  },true);
  function selectFig(fig){
    if(selFig)selFig.classList.remove('is-selected');
    selFig=fig;
    if(!fig){figTools.hidden=true;return}
    fig.classList.add('is-selected');
    const r=fig.getBoundingClientRect();
    figTools.style.top=(r.top+window.scrollY+8)+'px';
    figTools.style.left=(r.left+window.scrollX+8)+'px';
    figTools.hidden=false;
  }
  window.addEventListener('resize',()=>{if(selFig)selectFig(selFig)});
  figTools.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!selFig)return;
    const fig=selFig,act=b.dataset.fig;
    if(act==='delete'){
      const gal=fig.parentElement.classList.contains('gallery')?fig.parentElement:null;
      selectFig(null);fig.remove();
      if(gal&&!gal.querySelector('figure'))gal.remove();
      markDirty();status(t('deleted'));return;
    }
    if(act==='replace'&&fig.classList.contains('video')){status(t('noVideo'));return}
    pendingInsert={mode:act,fig};fileIn.value='';fileIn.click();
  });
  function addImageAtCaret(){
    const v=activeView();const prose=v&&v.querySelector('.prose');
    if(!prose){status(t('onlyBody'));return}
    const block=blockAtCaret();
    pendingInsert={mode:'caret',block:block&&prose.contains(block)?block:null,prose};
    fileIn.value='';fileIn.click();
  }
  fileIn.addEventListener('change',()=>{
    const f=fileIn.files&&fileIn.files[0];const p=pendingInsert;pendingInsert=null;
    if(!f||!p)return;
    if(p.mode==='replace'){replaceImage(p.fig,f);return}
    uploadAndInsert(f,fig=>{
      if(p.mode==='above')p.fig.before(fig);
      else if(p.mode==='below')p.fig.after(fig);
      else if(p.block)p.block.after(fig);
      else p.prose.appendChild(fig);
    });
  });

  async function shrink(file){
    if(file.type==='image/gif'||!window.createImageBitmap)return file;
    try{
      const bmp=await createImageBitmap(file);
      const scale=Math.min(1,1600/bmp.width);
      if(scale===1&&file.size<1.5e6)return file;
      const c=document.createElement('canvas');c.width=Math.round(bmp.width*scale);c.height=Math.round(bmp.height*scale);
      c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
      const blob=await new Promise(res=>c.toBlob(res,'image/webp',0.85));
      return blob&&blob.size<file.size?blob:file;
    }catch(e){return file}
  }
  async function upload(file){
    status(t('uploading'));
    const blob=await shrink(file);
    try{
      const r=await assets.upload(blob,blob.type?undefined:{type:'image/png'});
      return '/_blob/'+r.id;
    }catch(err){
      const c=err&&err.code;
      status(c==='too_large'?t('tooLarge'):c==='unsupported_type'?t('badType'):c==='quota_or_state'?t('full'):c==='rate_limited'?t('later'):t('upFail'));
      return null;
    }
  }
  function setSize(img){img.addEventListener('load',()=>{img.setAttribute('width',img.naturalWidth);img.setAttribute('height',img.naturalHeight)},{once:true})}
  async function replaceImage(fig,file){
    const src=await upload(file);if(!src)return;
    const img=fig.querySelector('img');img.removeAttribute('width');img.removeAttribute('height');setSize(img);img.src=src;
    markDirty();status(t('replaced'));selectFig(fig);
  }
  async function uploadAndInsert(file,place){
    const src=await upload(file);if(!src)return;
    const fig=document.createElement('figure');fig.className='shot';
    fig.innerHTML='<button class="zoom" type="button" aria-label="'+t('zoom')+'" contenteditable="false"><img loading="lazy" decoding="async" alt=""></button><figcaption>'+t('caption')+'</figcaption>';
    const img=fig.querySelector('img');setSize(img);img.src=src;
    place(fig);markDirty();status(t('inserted'));
    const cap=fig.querySelector('figcaption');const r=document.createRange();r.selectNodeContents(cap);const s=getSelection();s.removeAllRanges();s.addRange(r);
  }

  // ---- cancel ----
  function cancel(b){
    if(!dirty){leave();return}
    if(discardArmed){clearTimeout(discardArmed);discardArmed=null;dirty=false;location.reload();return}
    b.textContent=t('again');status(t('unsaved'));
    discardArmed=setTimeout(()=>{discardArmed=null;b.textContent=t('exit')},3500);
  }

  // ---- save ----
  function text(el){return (el.textContent||'').replace(/\s+/g,' ').trim()}
  function syncDerived(){
    appRoot.querySelectorAll('.view.week').forEach(v=>{
      const id=v.id,h1=v.querySelector('.week-head h1'),topics=v.querySelector('.week-head .topics');
      const title=h1?text(h1):'';
      appRoot.querySelectorAll('.rail .wk-link[data-view="'+id+'"] .wk-name').forEach(n=>n.textContent=title);
      appRoot.querySelectorAll('.wcard[data-view="'+id+'"]').forEach(card=>{
        const h=card.querySelector('h3');if(h)h.textContent=title;
        const ul=card.querySelector('ul');
        if(ul&&topics){ul.innerHTML='';topics.querySelectorAll('li').forEach(li=>{const x=text(li);if(x){const n=document.createElement('li');n.textContent=x;ul.appendChild(n)}})}
      });
      const num=id.slice(1);
      appRoot.querySelectorAll('.pager[data-view="'+id+'"]').forEach(p=>{const last=p.lastChild;if(last&&last.nodeType===3)last.textContent='Week '+num+' '+title});
      const heads=[...v.querySelectorAll('.prose h2,.prose h3')];
      const used=new Set();
      heads.forEach(h=>{if(h.id&&!used.has(h.id))used.add(h.id);else h.removeAttribute('id')});
      let n=1;heads.forEach(h=>{if(!h.id){while(used.has(id+'-s'+n))n++;h.id=id+'-s'+n;used.add(h.id)}});
      const items=heads.filter(h=>text(h)).map(h=>{const li=document.createElement('li');li.className=h.tagName==='H2'?'l2':'l3';const a=document.createElement('a');a.href='#'+h.id;a.dataset.sec=h.id;a.textContent=text(h);li.appendChild(a);return li});
      const rtoc=appRoot.querySelector('.toc[data-for="'+id+'"]');
      if(rtoc){rtoc.innerHTML='';items.forEach(li=>rtoc.appendChild(li.cloneNode(true)))}
      const mtoc=v.querySelector('.mtoc ol');
      if(mtoc){mtoc.innerHTML='';items.forEach(li=>mtoc.appendChild(li))}
    });
  }
  function clean(root){
    root.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
    root.querySelectorAll('[spellcheck]').forEach(e=>e.removeAttribute('spellcheck'));
    root.querySelectorAll('.is-selected').forEach(e=>e.classList.remove('is-selected'));
    root.querySelectorAll('[aria-current]').forEach(e=>e.removeAttribute('aria-current'));
    root.querySelectorAll('[aria-pressed]').forEach(e=>e.removeAttribute('aria-pressed'));
    root.querySelectorAll('.toc.open').forEach(e=>e.classList.remove('open'));
    root.querySelectorAll('.toc a.active').forEach(e=>e.classList.remove('active'));
    root.querySelectorAll('.view').forEach(v=>{v.hidden=v.id!=='course'});
    root.querySelectorAll('details.mtoc').forEach(d=>d.removeAttribute('open'));
    root.querySelectorAll('details.ops-index').forEach(d=>d.setAttribute('open',''));
    root.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(e=>e.remove());
    root.querySelectorAll('.prose [style],.week-head [style],.hero [style]').forEach(e=>{if(!e.closest('svg'))e.removeAttribute('style')});
    root.querySelectorAll('.prose font,.week-head font').forEach(f=>f.replaceWith(...f.childNodes));
    root.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{if(/^on/i.test(a.name)||(/^(href|src)$/i.test(a.name)&&/^\s*javascript:/i.test(a.value)))el.removeAttribute(a.name)})});
    root.querySelectorAll('.prose div:not([class]),.prose span:not([class])').forEach(el=>{if(!el.attributes.length&&el.parentElement&&el.parentElement.closest('.prose')&&el.tagName==='SPAN')el.replaceWith(...el.childNodes)});
  }
  async function serialize(){
    syncDerived();
    const shell=appRoot.querySelector('.shell').cloneNode(true);clean(shell);
    const cur=document.getElementById('tpl-'+window.TD.lang);
    const parts={};
    ['ko','en'].forEach(l=>{const tp=document.getElementById('tpl-'+l);parts[l]=tp===cur?shell.outerHTML:(tp?tp.innerHTML:'')});
    const vault=await window.TD.seal(parts);
    const lb=document.getElementById('lb').cloneNode(true);
    lb.hidden=true;lb.querySelector('img').removeAttribute('src');lb.querySelector('.lb-cap').textContent='';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
      HEAD_BITS+'<style id="td-style">'+STYLE+'</style>'+window.TD.GATE_HTML+'<div id="app-root"></div><script type="application/json" id="td-vault">'+JSON.stringify(vault)+'<\/script>'+lb.outerHTML+'<script id="td-app">'+APP+'<\/script></body></html>';
  }
  async function save(){
    if(saving)return;
    if(!dirty){status(t('nochange'));return}
    saving=true;status(t('saving'));
    let html;
    try{html=await serialize()}catch(e){saving=false;status(t('buildFail'));return}
    try{
      await art.publish(html);
      dirty=false;status(t('saved'));
    }catch(err){
      saving=false;
      const c=err&&err.code;
      if(c==='conflict'){dirty=false;status(t('conflict'))}
      else if(['not_writer','not_granted','consent_required','capability_disabled','capability_removed','not_declared'].includes(c))status(t('noPerm'));
      else if(c==='too_large')status(t('big'));
      else if(c==='rate_limited')status(t('rate'));
      else if(c==='invalid_content'||c==='transform_error')status(t('invalid'));
      else status(t('fail'));
    }
  }
})();
</script>
</body></html>
